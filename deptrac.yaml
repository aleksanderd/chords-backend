deptrac:
    paths:
        - ./packages
    exclude_files:
        - "#.*test.*#"
    layers:
        - name: Domain
          collectors:
              - type: bool
                must:
                    - type: classLike
                      value: .*Domain.*
                must_not:
                    - type: classLike
                      value: .*Bundle

        - name: Repository
          collectors:
              - type: bool
                must:
                    - type: classLike
                      value: .*Repository.*
                must_not:
                    - type: classLike
                      value: .*Domain\\Repository.*

        - name: Service
          collectors:
              - type: bool
                must:
                    - type: classLike
                      value: .*Service.*
                must_not:
                    - type: classLike
                      value: .*Domain\\Service.*

        - name: Controller
          collectors:
              - type: classLike
                value: .*Controller.*

    ruleset:
        Controller:
            - Service
        Service:
            - Repository
        Repository:
            - Domain
        Domain:
