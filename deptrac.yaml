deptrac:
    paths:
        - ./packages
    exclude_files:
        - "#.*test.*#"
    layers:
        - name: Domain
          collectors:
              - type: classLike
                value: .*Domain.*
        - name: Controller
          collectors:
              - type: classLike
                value: .*Controller.*
        - name: Repository
          collectors:
              - type: classLike
                value: .*Repository.*
        - name: Service
          collectors:
              - type: classLike
                value: .*Service.*
    ruleset:
        Controller:
            - Service
        Service:
            - Repository
        Repository:
            - Domain
        Domain:
