services:
    php-cli-base:
        build:
            context: .
            dockerfile: ./docker/php-cli/Dockerfile
        image: php-cli-base:latest
        container_name: php-cli-base

    php-fpm:
        build: docker
        container_name: "chords-php"
        ports:
            - "9000:9000"
        volumes:
            - ./:/app
            - ./docker/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini
        working_dir: /app
        extra_hosts:
            - "host.docker.internal:host-gateway"

    nginx:
        image: nginx
        container_name: "chords-nginx"
        working_dir: /app
        ports:
            - "7777:80"
        volumes:
            - ./:/app
            - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf

    postgres:
        image: postgres:18
        ports:
            - 15432:5432
        container_name: "chords-postgresql"
        working_dir: /app
        restart: always
        environment:
            POSTGRES_DB: "app"
            POSTGRES_USER: "user"
            POSTGRES_PASSWORD: "password"
        volumes:
            - dump:/app/dump
            - postgresql:/var/lib/postgresql/data

    memcached:
        image: memcached:latest
        container_name: "chords-memcached"
        restart: always
        ports:
            - 11211:11211

    redis:
        container_name: "chords-redis"
        image: redis:alpine
        ports:
            - 6379:6379

volumes:
    dump:
    postgresql:
